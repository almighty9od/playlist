<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заказ треков</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <div class="hero-center">
      <h1>Найди свой трек</h1>
      <p class="sub">Напиши исполнителя или название — вдруг он уже в плейлисте</p>
      
      <div class="search-container">
        <input id="search" placeholder="Например: Перемотка, ABBA, Цой…" autocomplete="off">
      </div>

      <div class="controls">
        <span id="count">—</span>
        <div class="btns">
          <button id="expand-all"  type="button">Развернуть всё</button>
          <button id="collapse-all" type="button">Свернуть всё</button>
        </div>
      </div>

      <div id="admin-bar" class="admin-bar" hidden>
        <span class="hint">Режим редактора: жми на ✎ рядом с плейлистом, чтобы переименовать.</span>
        <div class="btns">
          <button id="admin-export" type="button">⬇ Экспорт aliases.json</button>
          <button id="admin-reset"  type="button" class="danger">Сброс всех</button>
        </div>
      </div>
    </div>

    <main id="list"></main>
  </div>

  <footer>
    <span id="status"></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
